name: qoshni

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../backend:/code
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Bot: Mini App'ga kirish nuqtasi. Token bo'lmasa servis xato bilan chiqadi.
  bot:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    command: ["python", "-m", "app.bot"]
    depends_on:
      postgres:
        condition: service_healthy

  webapp:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "[ -x node_modules/.bin/vite ] || npm install --no-audit --no-fund; npm run dev -- --host 0.0.0.0"
    environment:
      QOSHNI_API_TARGET: http://api:8000
    volumes:
      - ../webapp:/app
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
