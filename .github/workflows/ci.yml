name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: qoshni
          POSTGRES_PASSWORD: qoshni
          POSTGRES_DB: qoshni
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qoshni -d qoshni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://qoshni:qoshni@localhost:5432/qoshni

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Bog'liqliklarni o'rnatish
        working-directory: backend
        run: uv sync --extra dev

      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Migratsiyalar
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Testlar
        working-directory: backend
        run: uv run pytest
