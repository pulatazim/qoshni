name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: qoshni
          POSTGRES_PASSWORD: qoshni
          POSTGRES_DB: qoshni
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qoshni -d qoshni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://qoshni:qoshni@localhost:5432/qoshni
      TEST_DATABASE_URL: postgresql+asyncpg://qoshni:qoshni@localhost:5432/qoshni_test
      TEST_REDIS_URL: redis://localhost:6379/9
      PGPASSWORD: qoshni

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Bog'liqliklarni o'rnatish
        working-directory: backend
        run: uv sync --extra dev

      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Migratsiyalar
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Test bazasini yaratish
        run: createdb -h localhost -U qoshni qoshni_test || echo "allaqachon bor"

      - name: Testlar
        working-directory: backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Bog'liqliklarni o'rnatish
        working-directory: webapp
        run: npm ci

      - name: Tip va qurish
        working-directory: webapp
        run: npm run build
